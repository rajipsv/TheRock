name: Change Impact Agent PR Comment

# Posts a change-impact summary on pull requests opened against this fork.
# Does not run on upstream ROCm/TheRock PRs unless this workflow exists there.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: pip install -r agents/change-impact-agent/requirements.txt

      - name: Run change-impact analysis
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="agents/change-impact-agent/out/pr-${{ github.event.pull_request.number }}"
          python agents/change-impact-agent/analyze.py \
            --end "${{ github.sha }}" \
            --pr-base-ref "${{ github.event.pull_request.base.ref }}" \
            --output-dir "$OUT"
          echo "report_path=$OUT/report.json" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = '${{ steps.analyze.outputs.report_path }}';
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const labels = (report.ci_recommendations?.suggested_pr_labels || []).join(', ') || 'none';
            const stages = (report.affected_build_stages || []).join(', ') || 'none';
            const body = [
              '## Change Impact Agent (AGENTS_030)',
              '',
              `**Severity:** ${report.severity} (score ${report.blast_radius_score})`,
              `**Affected build stages:** ${stages}`,
              `**Suggested labels:** ${labels}`,
              '',
              report.rationale?.length
                ? `**Notes:**\n${report.rationale.slice(0, 5).map((r) => `- ${r}`).join('\n')}`
                : '',
              '',
              '_Generated by change-impact-agent on this fork._',
            ].filter(Boolean).join('\n');

            const marker = '<!-- change-impact-agent -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            const fullBody = marker + '\n' + body;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
