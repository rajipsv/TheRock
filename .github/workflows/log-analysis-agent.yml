name: Log Analysis Agent (Post-Failure)

# Runs when monitored TheRock CI workflows fail on this fork/repo.
# Downloads failed job logs and produces report.json / report.html artifacts.

on:
  workflow_run:
    workflows:
      - "Multi-Arch CI"
      - "Multi-Arch CI - Windows"
      - "Multi-Arch CI ASAN"
      - "Unit Tests"
      - "Test Native Linux Packages Install"
      - "Test PyTorch Wheels"
      - "Test PyTorch Wheels (Full Suite)"
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  analyze-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install log-analysis-agent dependencies
        run: pip install -r agents/log-analysis-agent/requirements.txt

      - name: Analyze failed workflow run
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          OUT="agents/log-analysis-agent/out/run-${RUN_ID}"
          python agents/log-analysis-agent/analyze_log.py \
            --github-run-id "${RUN_ID}" \
            --repo "${{ github.repository }}" \
            --output-dir "${OUT}" \
            --max-jobs 2
          echo "output_dir=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload log analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: log-analysis-run-${{ github.event.workflow_run.id }}
          path: |
            agents/log-analysis-agent/out/run-${{ github.event.workflow_run.id }}/**
          if-no-files-found: error

      - name: Comment on linked PR
        if: github.event.workflow_run.pull_requests[0] != null
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const prNumber = context.payload.workflow_run.pull_requests[0].number;
            const outDir = '${{ steps.analyze.outputs.output_dir }}';
            const reportPath = path.join(outDir, 'report.json');
            if (!fs.existsSync(reportPath)) {
              core.info('No report.json at job root — may be multi-job output');
              return;
            }
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const marker = '<!-- log-analysis-agent -->';
            const body = [
              marker,
              '## Log Analysis Agent (AGENTS_030)',
              '',
              `**Workflow:** ${report.workflow_name || context.payload.workflow_run.name}`,
              `**Run:** [${context.payload.workflow_run.id}](${context.payload.workflow_run.html_url})`,
              `**Errors found:** ${report.errors_count ?? (report.errors || []).length}`,
              '',
              report.summary ? `**Summary:** ${report.summary}` : '',
              '',
              '_Download the log-analysis artifact from this workflow run for full HTML/JSON report._',
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
